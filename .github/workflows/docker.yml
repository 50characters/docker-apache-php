name: Docker images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        target: [runtime, debug]
    env:
      IMAGE: ldroid/apache-php:${{ matrix.php }}${{ matrix.target == 'debug' && '-debug' || '' }}
      XDEBUG_VERSION: '3.5.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            XDEBUG_VERSION=${{ env.XDEBUG_VERSION }}
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE }}-${{ github.sha }}
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}-${{ matrix.target }}

      - name: Verify PHP, extensions, Xdebug and Apache HTTP
        shell: pwsh
        run: |
          ./tests/Test-Image.ps1 -Image $env:IMAGE -PhpVersion '${{ matrix.php }}' -Target '${{ matrix.target }}' -XdebugVersion $env:XDEBUG_VERSION

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          docker push "$IMAGE"
          docker push "$IMAGE-${{ github.sha }}"
